server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # gzip ช่วยเยอะ — ไฟล์ js ก้อนเดียว 1.17 MB เหลือราว 327 KB
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ส่งต่อไปหลังบ้าน — หน้าเว็บเรียก /api/... เสมอ ไม่เคยรู้ว่า API อยู่พอร์ตอะไร
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # ผู้ช่วย AI ตอบเป็นสายทีละคำ (NDJSON) — ห้ามให้ nginx อมไว้จนจบ
    # ไม่ปิดสองบรรทัดนี้ ผู้ใช้จะเห็นจอนิ่งเป็นนาทีแล้วคำตอบโผล่มาทีเดียว
    proxy_buffering off;
    proxy_cache off;
    # คำถามที่ต้องให้โมเดลคิดใช้เวลาได้ถึง ~2 นาที ค่าเริ่มต้น 60 วิ จึงตัดกลางคัน
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # ไฟล์ที่มีลายนิ้วมือในชื่อ (index-abc123.js) เปลี่ยนชื่อทุกครั้งที่ build — cache ยาวได้
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: ทุกเส้นทางที่ไม่ใช่ไฟล์จริงต้องตกมาที่ index.html
  # ไม่มีบรรทัดนี้ กด F5 ที่ /dashboard/farms แล้วได้ 404
  location / {
    try_files $uri $uri/ /index.html;
  }
}
